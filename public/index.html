<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Trading Journal</title>
<link rel="icon" href="/api/media?type=logo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/app.css?v=4.0.0">
<script src="/assets/theme.js?v=4.0.0"></script>
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="Main navigation"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="wrap" id="view"><p class="muted">Loading your journal…</p></main>
    <footer class="footer" id="footer"></footer>
  </div>
</div>
<nav class="bottombar" id="bottombar" aria-label="Main navigation"></nav>

<dialog id="tradeDlg" class="dlg"></dialog>
<dialog id="modal" class="dlg sm"></dialog>
<dialog id="imgDlg" class="dlg img-dlg"><img id="imgFull" alt="Trade screenshot"><button class="btn" id="imgClose" type="button">Close</button></dialog>
<div id="toast" class="toast" hidden></div>

<script src="/assets/core.js?v=4.0.0"></script>
<script src="/assets/trades.js?v=4.0.0"></script>
<script src="/assets/insights.js?v=4.0.0"></script>
<script src="/assets/account.js?v=4.0.0"></script>
<script>TJ.start();</script>
</body>
</html>
